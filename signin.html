<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | XClipper</title>
    <link rel="icon" type="image/png" href="brand/Untitled design (13).png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getAnalytics } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAHEilT84J0jn_7N7IcVXGppXSiWkHFVug",
            authDomain: "humixo-2.firebaseapp.com",
            projectId: "humixo-2",
            storageBucket: "humixo-2.firebasestorage.app",
            messagingSenderId: "507179826520",
            appId: "1:507179826520:web:a03c9d652d3a5e08e9792d",
            measurementId: "G-G1TEG4C530"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const analytics = getAnalytics(app);
        const googleProvider = new GoogleAuthProvider();

        window.auth = auth;
        window.googleProvider = googleProvider;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithPopup = signInWithPopup;
        window.updateProfile = updateProfile;
    </script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            red: '#FF1F1F', 
                            glow: '#ff4d4d',
                            black: '#030000',
                            glass: 'rgba(255, 255, 255, 0.03)',
                            glassBorder: 'rgba(255, 255, 255, 0.08)'
                        }
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #030000;
            color: white;
            overflow-x: hidden;
        }
        
        .glass-panel {
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.02);
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(255, 31, 31, 0.9), rgba(180, 0, 0, 0.9));
            box-shadow: 0 0 15px rgba(255, 31, 31, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 100, 100, 0.2);
        }

        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 31, 31, 0.15), transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }

        .input-field {
            background: rgba(30, 30, 30, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            background: rgba(40, 40, 40, 0.6);
            border-color: rgba(255, 31, 31, 0.5);
            box-shadow: 0 0 20px rgba(255, 31, 31, 0.2);
        }
    </style>
</head>
<body class="selection:bg-brand-red selection:text-white">

    <!-- Ambient Background Blobs -->
    <div class="ambient-glow top-[-20%] left-[-10%] animate-blob"></div>
    <div class="ambient-glow bottom-[-20%] right-[-10%] animate-blob" style="animation-delay: 2s; background: radial-gradient(circle, rgba(100, 0, 0, 0.2), transparent 70%);"></div>

    <!-- Navigation -->
    <nav class="fixed w-full z-50 border-b border-white/5 bg-black/50 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <img src="/logo.png" alt="Humixo Logo" class="h-10 w-10">
                <span class="text-2xl font-black tracking-tight text-white">HUMIXO</span>
            </a>

            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-400">Already have an account?</span>
                <button class="text-sm font-medium text-white hover:text-brand-red transition-colors">Login</button>
            </div>
        </div>
    </nav>

    <!-- Signup Section -->
    <main class="relative min-h-screen flex items-center justify-center pt-20 pb-20 px-6">
        <div class="max-w-md w-full relative z-10">
            
            <!-- Signup Card -->
            <div class="glass-panel rounded-3xl p-8 md:p-10 relative">
                <!-- Glow Effect -->
                <div class="absolute -inset-1 bg-gradient-to-r from-brand-red to-orange-600 rounded-3xl blur opacity-20"></div>
                
                <div class="relative">
                    <!-- Header -->
                    <div class="text-center mb-8">
                        <h1 class="text-4xl font-black mb-3">Create Account</h1>
                        <p class="text-gray-400">Start creating viral thumbnails in seconds</p>
                    </div>

                    <!-- Social Signup -->
                    <div class="mb-6">
                        <button id="googleSignIn" class="w-full flex items-center justify-center gap-3 py-3 rounded-xl glass-panel hover:bg-white/5 transition-all duration-300 group">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                            </svg>
                            <span class="font-semibold">Continue with Google</span>
                        </button>
                    </div>

                    <!-- Divider -->
                    <div class="relative mb-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-white/10"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-4 bg-transparent text-gray-500">Or continue with email</span>
                        </div>
                    </div>

                    <!-- Signup Form -->
                    <form id="signupForm" class="space-y-4">
                        <div id="errorMessage" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm"></div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Full Name</label>
                            <input type="text" id="fullName" placeholder="John Doe" required
                                   class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-0">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                            <input type="email" id="email" placeholder="you@example.com" required
                                   class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-0">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                            <input type="password" id="password" placeholder="••••••••" required
                                   class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-0">
                        </div>

                        <!-- Terms -->
                        <div class="flex items-start gap-2 pt-2">
                            <input type="checkbox" id="terms" required class="mt-1 w-4 h-4 rounded border-gray-600 bg-gray-800 text-brand-red focus:ring-brand-red focus:ring-offset-0">
                            <label for="terms" class="text-sm text-gray-400">
                                I agree to the <a href="#" class="text-brand-red hover:underline">Terms of Service</a> and <a href="#" class="text-brand-red hover:underline">Privacy Policy</a>
                            </label>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="submitBtn" class="w-full glass-button py-3.5 rounded-xl font-bold text-white hover:brightness-110 transition-all duration-300 flex items-center justify-center gap-2 mt-6">
                            <span id="btnText">Create Account</span>
                            <i data-lucide="arrow-right" class="w-4 h-4" id="btnIcon"></i>
                            <div id="btnLoader" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                        </button>
                    </form>

                    <!-- Features List -->
                    <div class="mt-8 pt-6 border-t border-white/10">
                        <p class="text-xs text-gray-500 mb-3 uppercase tracking-wide font-semibold">What you'll get:</p>
                        <div class="space-y-2">
                            <div class="flex items-center gap-2 text-sm text-gray-300">
                                <i data-lucide="check" class="w-4 h-4 text-brand-red"></i>
                                <span>3 free credits to start</span>
                            </div>
                            <div class="flex items-center gap-2 text-sm text-gray-300">
                                <i data-lucide="check" class="w-4 h-4 text-brand-red"></i>
                                <span>AI-powered thumbnail generation</span>
                            </div>
                            <div class="flex items-center gap-2 text-sm text-gray-300">
                                <i data-lucide="check" class="w-4 h-4 text-brand-red"></i>
                                <span>Access to style cloner</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Trust Badges -->
            <div class="mt-8 text-center">
                <p class="text-xs text-gray-500 mb-4">Trusted by 10,000+ creators worldwide</p>
                <div class="flex items-center justify-center gap-6 opacity-40">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                    <i data-lucide="lock" class="w-5 h-5"></i>
                    <i data-lucide="zap" class="w-5 h-5"></i>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // Google Sign In
        document.getElementById('googleSignIn').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                window.location.href = '/workspace.html';
            } catch (error) {
                showError(error.message);
            }
        });

        // Email/Password Sign Up
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const terms = document.getElementById('terms').checked;

            if (!terms) {
                showError('Please accept the Terms of Service and Privacy Policy');
                return;
            }

            setLoading(true);
            hideError();

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, {
                    displayName: fullName
                });
                window.location.href = '/workspace.html';
            } catch (error) {
                setLoading(false);
                let errorMessage = 'An error occurred. Please try again.';
                
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'This email is already registered.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Password should be at least 6 characters.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address.';
                }
                
                showError(errorMessage);
            }
        });

        function setLoading(loading) {
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnLoader = document.getElementById('btnLoader');

            if (loading) {
                submitBtn.disabled = true;
                btnText.textContent = 'Creating Account...';
                btnIcon.classList.add('hidden');
                btnLoader.classList.remove('hidden');
            } else {
                submitBtn.disabled = false;
                btnText.textContent = 'Create Account';
                btnIcon.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.add('hidden');
        }
    </script>
</body>
</html>
