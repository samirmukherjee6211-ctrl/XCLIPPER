<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humixo - Thumbnail Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }
        #root {
            height: 100vh;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ef4444;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root">
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading Humixo...</p>
        </div>
    </div>
    <script type="module" src="./workspace.tsx"></script>
    <script>
        // Error handling
        window.addEventListener('error', function(e) {
            console.error('Error loading app:', e);
            document.getElementById('loading').innerHTML = '<div style="color: #ef4444;"><h2>Error Loading App</h2><p>' + e.message + '</p><p>Check console for details</p></div>';
        });
        
        // Remove loading indicator after 5 seconds if app loads
        setTimeout(function() {
            var loading = document.getElementById('loading');
            if (loading && document.querySelector('#root > div:not(#loading)')) {
                loading.remove();
            }
        }, 5000);
    </script>
</body>
</html>
